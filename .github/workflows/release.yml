name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.1)"
        required: true
        type: string
      notify_issues:
        description: "Comment on open related/fixes issues asking reporters to retest"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Verify quickshell/VERSION matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(cat quickshell/VERSION)
          if [ "${version#v}" != "${TAG#v}" ]; then
            echo "::error::quickshell/VERSION is '${version}' but the tag is '${TAG}'"; exit 1
          fi

  build-core:
    needs: [verify-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, arch: amd64 }
          - { goos: linux, arch: arm64 }
          - { goos: freebsd, arch: amd64 }
          - { goos: freebsd, arch: arm64 }

    defaults:
      run:
        working-directory: core

    env:
      TAG: ${{ inputs.tag }}
      # linux assets keep their historical arch-only names
      ASSET: ${{ matrix.goos == 'linux' && matrix.arch || format('{0}-{1}', matrix.goos, matrix.arch) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod

      - name: Format check
        if: matrix.goos == 'linux'
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run tests
        if: matrix.goos == 'linux'
        run: go test -v ./...

      - name: Build cyshell-install (${{ env.ASSET }})
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eux
          cd cmd/cyshell-install
          go build -trimpath -ldflags "-s -w -X main.Version=${TAG}" \
            -o ../../cyshell-install-${{ env.ASSET }}
          cd ../..
          gzip -9 -k cyshell-install-${{ env.ASSET }}
          sha256sum cyshell-install-${{ env.ASSET }}.gz > cyshell-install-${{ env.ASSET }}.gz.sha256

      - name: Sync embedded shell
        run: make sync-shell

      - name: Build cyshell (${{ env.ASSET }})
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eux
          cd cmd/cyshell
          go build -trimpath -tags withshell -ldflags "-s -w -X main.Version=${TAG}" \
            -o ../../cyshell-${{ env.ASSET }}
          cd ../..
          gzip -9 -k cyshell-${{ env.ASSET }}
          sha256sum cyshell-${{ env.ASSET }}.gz > cyshell-${{ env.ASSET }}.gz.sha256

      - name: Generate shell completions
        if: matrix.goos == 'linux' && matrix.arch == 'amd64'
        run: |
          set -eux
          chmod +x cyshell-amd64
          ./cyshell-amd64 completion bash > completion.bash
          ./cyshell-amd64 completion fish > completion.fish
          ./cyshell-amd64 completion zsh > completion.zsh

      - name: Build cyshell-distropkg (${{ env.ASSET }})
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eux
          cd cmd/cyshell
          go build -trimpath -tags 'distro_binary withshell' -ldflags "-s -w -X main.Version=${TAG}" \
            -o ../../cyshell-distropkg-${{ env.ASSET }}
          cd ../..
          gzip -9 -k cyshell-distropkg-${{ env.ASSET }}
          sha256sum cyshell-distropkg-${{ env.ASSET }}.gz > cyshell-distropkg-${{ env.ASSET }}.gz.sha256

      - name: Upload artifacts (${{ env.ASSET }})
        if: matrix.goos == 'linux' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v5
        with:
          name: core-assets-${{ env.ASSET }}
          path: |
            core/cyshell-install-${{ env.ASSET }}.gz
            core/cyshell-install-${{ env.ASSET }}.gz.sha256
            core/cyshell-${{ env.ASSET }}.gz
            core/cyshell-${{ env.ASSET }}.gz.sha256
            core/cyshell-distropkg-${{ env.ASSET }}.gz
            core/cyshell-distropkg-${{ env.ASSET }}.gz.sha256
          if-no-files-found: error

      - name: Upload artifacts (${{ env.ASSET }}, no installer)
        if: matrix.goos != 'linux'
        uses: actions/upload-artifact@v5
        with:
          name: core-assets-${{ env.ASSET }}
          path: |
            core/cyshell-${{ env.ASSET }}.gz
            core/cyshell-${{ env.ASSET }}.gz.sha256
            core/cyshell-distropkg-${{ env.ASSET }}.gz
            core/cyshell-distropkg-${{ env.ASSET }}.gz.sha256
          if-no-files-found: error

      - name: Upload artifacts with completions
        if: matrix.goos == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v5
        with:
          name: core-assets-${{ env.ASSET }}
          path: |
            core/cyshell-install-${{ env.ASSET }}.gz
            core/cyshell-install-${{ env.ASSET }}.gz.sha256
            core/cyshell-${{ env.ASSET }}.gz
            core/cyshell-${{ env.ASSET }}.gz.sha256
            core/cyshell-distropkg-${{ env.ASSET }}.gz
            core/cyshell-distropkg-${{ env.ASSET }}.gz.sha256
            core/completion.bash
            core/completion.fish
            core/completion.zsh
          if-no-files-found: error

  # update-versions:
  #   runs-on: ubuntu-latest
  #   needs: build-core
  #   steps:
  #     - name: Create GitHub App token
  #       id: app_token
  #       uses: actions/create-github-app-token@v1
  #       with:
  #         app-id: ${{ secrets.APP_ID }}
  #         private-key: ${{ secrets.APP_PRIVATE_KEY }}

  #     - name: Checkout
  #       uses: actions/checkout@v6
  #       with:
  #         token: ${{ steps.app_token.outputs.token }}
  #         fetch-depth: 0

  #     - name: Update VERSION
  #       env:
  #         GH_TOKEN: ${{ steps.app_token.outputs.token }}
  #       run: |
  #         set -euo pipefail
  #         git config user.name "cyshell-ci[bot]"
  #         git config user.email "cyshell-ci[bot]@users.noreply.github.com"

  #         version="${GITHUB_REF#refs/tags/}"
  #         echo "Updating to version: $version"
  #         echo "${version}" > quickshell/VERSION
  #         git add quickshell/VERSION

  #         if ! git diff --cached --quiet; then
  #           git commit -m "chore: bump version to $version"
  #           git pull --rebase origin master
  #           git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:master
  #         fi

  #         git tag -f "${version}"
  #         git push -f https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git "${version}"

  release:
    runs-on: ubuntu-24.04
    needs: [build-core] #, update-versions]
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Fetch updated tag after version bump
        run: |
          git fetch origin --force tag ${TAG}
          git checkout ${TAG}
          git submodule update --init --recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod

      - name: Download core artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: core-assets-*
          merge-multiple: true
          path: ./_core_assets

      - name: Generate Changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          CHANGELOG=""
          if [ -n "$PREVIOUS_TAG" ]; then
            # PR-based notes with author credits; falls back to raw git log below
            CHANGELOG=$(python3 scripts/release-notes.py "${PREVIOUS_TAG}..${TAG}" --format github --bare 2>/dev/null || true)
          fi
          if [ -z "$CHANGELOG" ]; then
            echo "release-notes.py unavailable or empty, using git log fallback"
            if [ -z "$PREVIOUS_TAG" ]; then
              CHANGELOG=$(git log --oneline --pretty=format:"%an|%s (%h)" | grep -v "^github-actions\[bot\]|" | sed 's/^[^|]*|/- /' | head -50)
            else
              CHANGELOG=$(git log --oneline --pretty=format:"%an|%s (%h)" "${PREVIOUS_TAG}..${TAG}" | grep -v "^github-actions\[bot\]|" | sed 's/^[^|]*|/- /')
            fi
          fi

          cat > RELEASE_BODY.md << 'EOF'
          ## Installation

          ```bash
          curl -fsSL https://install.danklinux.com | sh
          ```

          ## Assets

          ### Complete Packages
          - **`cyshell-full-amd64.tar.gz`** - Complete package for x86_64 systems (CLI binaries + QML source + shell completions + installation guide)
          - **`cyshell-full-arm64.tar.gz`** - Complete package for ARM64 systems (CLI binaries + QML source + shell completions + installation guide)
          - **`cyshell-full-freebsd-amd64.tar.gz`** - Complete package for FreeBSD x86_64 systems
          - **`cyshell-full-freebsd-arm64.tar.gz`** - Complete package for FreeBSD ARM64 systems

          ### Individual Components
          - **`cyshell-cli-amd64.gz`** - CyShell CLI binary for x86_64 systems
          - **`cyshell-cli-arm64.gz`** - CyShell CLI binary for ARM64 systems
          - **`cyshell-cli-freebsd-amd64.gz`** - CyShell CLI binary for FreeBSD x86_64 systems
          - **`cyshell-cli-freebsd-arm64.gz`** - CyShell CLI binary for FreeBSD ARM64 systems
          - **`cyshell-distropkg-amd64.gz`** - CyShell CLI binary built with distro_package tag for AMD64 systems
          - **`cyshell-distropkg-arm64.gz`** - CyShell CLI binary built with distro_package tag for ARM64 systems
          - **`cyshell-distropkg-freebsd-amd64.gz`** - CyShell CLI binary built with distro_package tag for FreeBSD x86_64 systems
          - **`cyshell-distropkg-freebsd-arm64.gz`** - CyShell CLI binary built with distro_package tag for FreeBSD ARM64 systems
          - **`cyshell-install-amd64.gz`** - Installer binary for x86_64 systems
          - **`cyshell-install-arm64.gz`** - Installer binary for ARM64 systems
          - **`cyshell-cli-<version>.tar.gz`** - Go source code with vendored modules (for distro packaging)
          - **`cyshell-qml.tar.gz`** - QML source code only
          - **`cyshell-source.tar.gz`** - Full repository source with bundled DankCommon (for distro packaging)

          ### Checksums
          - **`*.sha256`** - SHA256 checksums for verifying download integrity

          **Installation:** Extract the `cyshell-full-*.tar.gz` package for your architecture and follow the `INSTALL.md` instructions inside.

          ---

          EOF

          cat >> RELEASE_BODY.md << EOF
          ## What's Changed

          $CHANGELOG

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${TAG}
          EOF

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_BODY.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          set -euxo pipefail

          mkdir -p _release_assets

          # Copy core binaries and rename cyshell-*.gz to cyshell-cli-*.gz
          for file in _core_assets/cyshell-*.gz*; do
            if [ -f "$file" ]; then
              basename=$(basename "$file")
              if [[ "$basename" == cyshell-distropkg-* ]]; then
                cp "$file" "_release_assets/$basename"
              else
                newname=$(echo "$basename" | sed 's/^cyshell-/cyshell-cli-/')
                cp "$file" "_release_assets/$newname"
              fi
            fi
          done

          # Copy cyshell-install binaries
          cp _core_assets/cyshell-install-*.gz* _release_assets/

          # Copy completions
          cp _core_assets/completion.* _release_assets/ 2>/dev/null || true

          # Replace the DankCommon symlink with real submodule content for packaging
          rm quickshell/DankCommon
          cp -r dank-qml-common/DankCommon quickshell/DankCommon

          # Create full source tarball (GitHub tag archives never contain submodule content)
          VERSION_NUM=${TAG#v}
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='dank-qml-common' \
              --exclude='_release_assets' \
              --exclude='_core_assets' \
              --exclude='RELEASE_BODY.md' \
              --transform "s,^\.,CyShell-Desktop-${VERSION_NUM},S" \
              -czf _release_assets/cyshell-source.tar.gz .
          (cd _release_assets && sha256sum cyshell-source.tar.gz > cyshell-source.tar.gz.sha256)

          # Create QML source package (exclude build artifacts and git files)
          # Copy root LICENSE and CONTRIBUTING.md to quickshell/ for packaging
          cp LICENSE CONTRIBUTING.md quickshell/

          # Copy root assets directory to quickshell for systemd service and desktop file
          cp -r assets quickshell/

          # Tar the CONTENTS of quickshell/, not the directory itself
          (cd quickshell && tar --exclude='.git' \
              --exclude='.github' \
              --exclude='./tests' \
              --exclude='*.tar.gz' \
              --exclude-from=../scripts/shell-test-excludes.txt \
              -czf ../_release_assets/cyshell-qml.tar.gz .)

          # Generate checksum for QML package
          (cd _release_assets && sha256sum cyshell-qml.tar.gz > cyshell-qml.tar.gz.sha256)

          # Create full packages for each os/architecture
          for arch in amd64 arm64 freebsd-amd64 freebsd-arm64; do
            mkdir -p _temp_full/cyshell
            mkdir -p _temp_full/bin
            mkdir -p _temp_full/completions

            # Extract QML source
            tar -xzf _release_assets/cyshell-qml.tar.gz -C _temp_full/cyshell

            # Add CLI binaries
            if [ -f "_core_assets/cyshell-${arch}.gz" ]; then
              gunzip -c "_core_assets/cyshell-${arch}.gz" > _temp_full/bin/cyshell
              chmod +x _temp_full/bin/cyshell
            fi

            if [ -f "_core_assets/cyshell-distropkg-${arch}.gz" ]; then
              gunzip -c "_core_assets/cyshell-distropkg-${arch}.gz" > _temp_full/bin/cyshell-distropkg
              chmod +x _temp_full/bin/cyshell-distropkg
            fi

            # Add shell completions
            for completion in _core_assets/completion.*; do
              if [ -f "$completion" ]; then
                cp "$completion" _temp_full/completions/
              fi
            done

            # Copy docs directory
            if [ -d "docs" ]; then
              cp -r docs _temp_full/
            fi

            # Create installation guide
            cat > _temp_full/INSTALL.md << 'EOFINSTALL'
          # CyShell Installation

          ## Requirements

          - Wayland compositor (niri or Hyprland recommended)
          - Quickshell framework
          - Qt6

          ## Installation Steps

          The Quickshell UI is embedded in the `cyshell` binary. The bundled `cyshell/`
          tree is optional — pass it with `-c` or `CYSHELL_SHELL_DIR` to run a
          modified copy instead of the embedded UI.

          1. **Install the CyShell CLI binaries:**
             ```bash
             sudo install -m 755 bin/cyshell /usr/local/bin/cyshell
             ```

          2. **Install shell completions (optional):**
             ```bash
             # Bash
             sudo install -m 644 completions/completion.bash /usr/share/bash-completion/completions/cyshell

             # Fish
             sudo install -m 644 completions/completion.fish /usr/share/fish/vendor_completions.d/cyshell.fish

             # Zsh
             sudo install -m 644 completions/completion.zsh /usr/share/zsh/site-functions/_cyshell
             ```

          3. **Start the shell:**
             ```bash
             cyshell run
             ```

          ## Configuration

          - Settings are stored in `~/.config/CyShell/settings.json`
          - Plugins go in `~/.config/CyShell/plugins/`
          - See the documentation in the `cyshell/` directory for more details

          ## Troubleshooting

          - Run with verbose output: `CYSHELL_LOG_LEVEL=debug cyshell run`
          - Ensure all dependencies are installed
          EOFINSTALL

            # Create the full package
            (cd _temp_full && tar -czf "../_release_assets/cyshell-full-${arch}.tar.gz" .)

            # Generate checksum
            (cd _release_assets && sha256sum "cyshell-full-${arch}.tar.gz" > "cyshell-full-${arch}.tar.gz.sha256")

            # Cleanup
            rm -rf _temp_full
          done

      - name: Generate vendored source tarball
        run: |
          set -euxo pipefail
          VERSION_NUM=${TAG#v}
          cd core
          go mod vendor
          cd ..
          tar czf "_release_assets/cyshell-cli-${VERSION_NUM}.tar.gz" \
            --transform "s,^core/,cyshell-cli-${VERSION_NUM}/," \
            --exclude='core/.git' \
            core/
          (cd _release_assets && sha256sum "cyshell-cli-${VERSION_NUM}.tar.gz" > "cyshell-cli-${VERSION_NUM}.tar.gz.sha256")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: _release_assets/**
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ask reporters on still-open "related/fixes #N" issues to retest.
      # Opt-in via notify_issues (Point release defaults it on). Skipped for
      # prereleases. Preview: scripts/notify-issues.sh <prev> <tag> --dry-run
      - name: Notify open issues to retest
        if: ${{ inputs.notify_issues && !contains(env.TAG, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "no previous tag; skipping issue notify"
            exit 0
          fi
          bash scripts/notify-issues.sh "$PREVIOUS_TAG" "$TAG"

  # Pin the satellite repos to this release's version. Each dispatch target
  # decides for itself whether to tag: X.Y.0 always tags, X.Y.Z skips when the
  # repo has no commits of its own since its last tag.
  fanout:
    name: Pin ${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ !contains(inputs.tag, '-') }}
    strategy:
      fail-fast: false
      matrix:
        repo:
          - dgop
          - dankgo
          - dank-qml-common
          - dankcalendar
          - danksearch
          - dank-greeter
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      - name: Dispatch pin-release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ matrix.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run pin-release.yml --repo "$REPO" -f version="$TAG"
          echo "dispatched pin-release ${TAG} to ${REPO}" >> "$GITHUB_STEP_SUMMARY"
