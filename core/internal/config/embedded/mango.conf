# CyShell — MangoWM configuration (managed by `cyshell setup`)
# Keybinds, colors, layout, outputs, cursor and window rules are pulled from the
# ./cyshell fragments below. Add your own binds/rules here; they sit alongside CyShell's.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# exec-once runs only at startup. Do NOT use exec= for the shell: mango re-runs
# every exec= on each config reload, and CyShell reloads the config, which would
# spawn a new shell on every reload.
exec-once=cyshell run

source=./cyshell/colors.conf
source=./cyshell/layout.conf
source=./cyshell/cursor.conf
source=./cyshell/outputs.conf
source=./cyshell/windowrules.conf
source=./cyshell/binds.conf
