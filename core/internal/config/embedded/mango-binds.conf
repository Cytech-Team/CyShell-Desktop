# CyShell default keybinds (MangoWM) — managed by CyShell, regenerated by `cyshell setup`.
# Format: bind=MODS,key,action[,args]
# Put bind descriptions above bind lines; inline # comments break Mango spawn args.

# === Application Launchers ===
# Open Terminal
bind=SUPER,t,spawn,{{TERMINAL_COMMAND}}
# Open Terminal
bind=SUPER,Return,spawn,{{TERMINAL_COMMAND}}
# Application Launcher
bind=SUPER,space,spawn,cyshell ipc call spotlight toggle
# Spotlight Bar
bind=ALT,space,spawn,cyshell ipc call spotlight-bar toggle
# Clipboard Manager
bind=SUPER,v,spawn,cyshell ipc call clipboard toggle
# Task Manager
bind=SUPER,m,spawn,cyshell ipc call processlist focusOrToggle
# Settings
bind=SUPER,comma,spawn,cyshell ipc call settings focusOrToggle
# Notification Center
bind=SUPER,n,spawn,cyshell ipc call notifications toggle
# Notepad
bind=SUPER+SHIFT,n,spawn,cyshell ipc call notepad toggle
# Browse Wallpapers
bind=SUPER,y,spawn,cyshell ipc call dash toggle wallpaper
# Power Menu
bind=SUPER,x,spawn,cyshell ipc call powermenu toggle
# Cycle Display Profile
bind=SUPER,p,spawn,cyshell ipc outputs cycleProfile

# === Cheat sheet ===
# Keyboard Shortcuts
bind=SUPER+SHIFT,slash,spawn,cyshell ipc call keybinds toggle mangowc

# === Security ===
# Lock Screen
bind=SUPER+ALT,l,spawn,cyshell ipc call lock lock
# Task Manager
bind=CTRL+ALT,Delete,spawn,cyshell ipc call processlist focusOrToggle

# === Window Rules ===
# Create Window Rule
bind=SUPER+SHIFT,w,spawn,cyshell ipc call window-rules toggle

# === Screenshots ===
# Screenshot: Interactive
bind=none,Print,spawn,cyshell screenshot
# Screenshot: Full Screen
bind=CTRL,Print,spawn,cyshell screenshot full
# Screenshot: Window
bind=ALT,Print,spawn,cyshell screenshot window

# === Audio Controls ===
bind=none,XF86AudioRaiseVolume,spawn,cyshell ipc call audio increment 3
bind=none,XF86AudioLowerVolume,spawn,cyshell ipc call audio decrement 3
bind=none,XF86AudioMute,spawn,cyshell ipc call audio mute
bind=none,XF86AudioMicMute,spawn,cyshell ipc call audio micmute
bind=none,XF86AudioPlay,spawn,cyshell ipc call mpris playPause
bind=none,XF86AudioPause,spawn,cyshell ipc call mpris playPause
bind=none,XF86AudioPrev,spawn,cyshell ipc call mpris previous
bind=none,XF86AudioNext,spawn,cyshell ipc call mpris next

# === Brightness Controls ===
bind=none,XF86MonBrightnessUp,spawn,cyshell ipc call brightness increment 5
bind=none,XF86MonBrightnessDown,spawn,cyshell ipc call brightness decrement 5

# === Window Management ===
# Close Window
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,o,toggleoverview
bind=ALT,Tab,toggleoverview
# Exit Compositor
bind=SUPER+SHIFT,e,quit,

# === Focus Navigation ===
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,Left,focusdir,left
bind=SUPER,H,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,L,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,K,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,J,focusdir,down

# === Window Movement ===
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,J,exchange_client,down

# === Monitor Navigation ===
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+ALT+SHIFT,Left,tagmon,left
bind=SUPER+ALT+SHIFT,Right,tagmon,right

# === Layout ===
# Cycle Layout - Gaps, Floating, Tiling
bind=SUPER+ALT,j,switch_layout
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1

# === Tags (1-9): view tag ===
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# === Tags (1-9): move focused window to tag ===
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# === Touchpad Gestures ===
# 3-finger horizontal swipe: switch between occupied workspaces
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,left,3,viewtoright_have_client
# 4-finger vertical swipe: toggle the overview
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
